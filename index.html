<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111114"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>Notes</title>
<style>
:root{--bg:#111114;--pn:#18181d;--tx:#e8e8ee;--mu:#8a8a96;--ac:#7c5cff;--ln:#2a2a32}
:root.l{--bg:#f6f6f9;--pn:#fff;--tx:#1b1b22;--mu:#6b6b78;--ln:#dcdce3}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
#sb{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .22s;z-index:30;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.sb #sb{transform:none}
#sh{position:fixed;inset:0;background:#0007;display:none;z-index:25}body.sb #sh{display:block}
#sbh{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 6px;font-weight:650;font-size:19px}#sbh button{font-size:14px;padding:4px 10px}
#tb{display:flex;gap:6px;padding:8px 10px}#tb button{flex:1;padding:8px 4px;font-size:14px}
#sq{margin:0 10px 8px;width:calc(100% - 20px);padding:8px 10px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;font-size:16px}
#tree{flex:1;overflow:auto}
.r{display:flex;align-items:center;gap:7px;padding:8px 10px;border-left:3px solid transparent;cursor:pointer}
.r:hover{background:#ffffff0a}.r.a{background:#ffffff14}
.r b{flex:1;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r i{font-style:normal;color:var(--mu);padding:0 8px}
.ch{width:7px;height:7px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(-45deg);transition:transform .15s;margin:0 5px 0 2px;flex:none}.ch.o{transform:rotate(45deg)}
.lk{width:15px;height:15px;fill:none;stroke:var(--mu);stroke-width:2;flex:none}
#ed{height:100%;overflow:auto;padding:0 clamp(16px,6vw,70px) 40px}
@media(min-width:900px){body.sb #ed{margin-left:320px}body.sb #sh{display:none}}
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
#ph{color:var(--mu);margin-top:25vh;text-align:center}#ew{display:none;max-width:760px;margin:auto}
#pm{position:fixed;right:14px;top:calc(56px + env(safe-area-inset-top));display:none;background:var(--pn);border:1px solid var(--ln);border-radius:12px;min-width:250px;padding:6px;z-index:40;box-shadow:0 8px 30px #0009}
#pm>div,#pm label{padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}#pm>div:hover{background:#ffffff10}
#ac{width:44px;height:28px;padding:0;border:1px solid var(--ln);border-radius:6px;background:none}
#ti{background:none;border:0;color:var(--tx);font:700 28px/1.3 -apple-system,system-ui,sans-serif;width:100%;outline:0;padding:0}
#bd{min-height:45vh;outline:0;caret-color:var(--ac);padding:10px 0}
#bd:empty::before{content:attr(data-p);color:var(--mu)}
#bd h1{font-size:25px;margin:.6em 0 .2em}#bd h2{font-size:20px}
#bd blockquote{border-left:3px solid var(--ac);margin:8px 0;padding:2px 14px;color:var(--mu)}
#bd pre{background:var(--pn);padding:10px 12px;border-radius:8px;overflow:auto;font:14px ui-monospace,monospace}
#bd hr{border:0;border-top:1px solid var(--ln);margin:16px 0}
a.wl,.bl div{color:var(--ac);background:#ffffff0d;padding:1px 7px;border-radius:6px;cursor:pointer;text-decoration:none}
.chk{cursor:pointer}.chk::before{content:"☐";color:var(--ac);font-size:1.1em}.chk.d::before{content:"☑"}
.ci:has(.chk.d){text-decoration:line-through;color:var(--mu)}
.bl{margin-top:30px;border-top:1px solid var(--ln);padding-top:12px;color:var(--mu);font-size:14px}.bl div{display:inline-block;margin:6px 6px 0 0}
#fb{position:fixed;display:none;gap:4px;z-index:9;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:4px;box-shadow:0 6px 24px #0008}#fb button{padding:4px 11px}
#mn{position:fixed;display:none;z-index:9;background:var(--pn);border:1px solid var(--ln);border-radius:12px;width:230px;max-height:260px;overflow:auto;box-shadow:0 8px 30px #000a}
.it{padding:9px 14px;cursor:pointer}.it.s{background:var(--ac);color:#fff}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:18px;width:min(360px,92vw)}
dialog::backdrop{background:#000a}dialog label{display:block;margin:12px 0 4px;color:var(--mu);font-size:13px}
dialog input,dialog select{width:100%;padding:9px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;font-size:16px}
.bt{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}.ok{background:var(--ac);border-color:var(--ac);color:#fff}
#ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--ln);padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
</style></head><body class="sb">
<div id="sh"></div>
<div id="sb"><div id="sbh">Bibliothèque<button id="hd">Masquer</button></div>
 <div id="tb"><button class="p" id="nn">Note</button><button id="nf">Dossier</button><button id="nv">Coffre</button></div>
 <input id="sq" placeholder="Rechercher…"><div id="tree"></div></div>
<div id="ed"><div id="top"><button id="lb">Bibliothèque</button><button id="mb">Menu</button></div>
 <div id="ph">Choisis une note ou crée-en une.<br><small>Tape / pour insérer un bloc, [[ pour lier une note.</small></div>
 <div id="ew"><input id="ti" placeholder="Titre"><div id="bd" contenteditable="true" data-p="Écris ici… tape / pour les blocs"></div><div class="bl" id="bl"></div></div></div>
<div id="pm"><div id="sd">Synchroniser (envoyer le fichier)</div><div id="im">Importer un fichier</div><div id="tr">Corbeille</div><div id="lk">Verrouiller les coffres</div><div id="th">Thème clair / sombre</div><label>Couleur d'accent<input type="color" id="ac"></label></div>
<div id="fb"><button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="strikeThrough"><s>S</s></button><button data-c="hl">Surligner</button><button data-c="removeFormat">Effacer</button></div><div id="mn"></div><div id="ts"></div><input type="file" id="fi" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s),K='nv1',now=()=>Date.now();
let S={notes:{},folders:{},ac:'#7c5cff',lx:now()},keys={},pl={},cur=null,sel=null,open=new Set(),ctx=null,mi=0,L=[],tm;
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const uid=()=>Math.random().toString(36).slice(2,10)+now().toString(36);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Stockage plein : exporte tes notes')}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#ts');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2600)}
const live=o=>Object.values(o).filter(x=>!x.deleted);
const vid=f=>{while(f){const x=S.folders[f];if(!x)return null;if(x.vault)return x.id;f=x.parent}return null};
const vk=n=>vid(n.folder),T=n=>vk(n)?(pl[n.id]?pl[n.id].t:''):n.title,B=n=>vk(n)?(pl[n.id]?.b||''):n.body;
const sub=i=>{const s=new Set(),w=p=>live(S.folders).filter(f=>f.parent==p).forEach(f=>{s.add(f.id);w(f.id)});w(i);return s};
/* chiffrement */
const te=new TextEncoder(),td=new TextDecoder(),b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mk(pw,salt){const m=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(salt),iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function E(k,t){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(t)))}
async function D(k,s){const[i,c]=s.split('.');return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(i)},k,ub(c)))}
/* dialogue */
function ask(t,f,del){return new Promise(res=>{const d=document.createElement('dialog');
 d.innerHTML=`<form method="dialog"><b>${esc(t)}</b>`+f.map(x=>`<label>${x.l}</label>`+(x.o?`<select name="${x.k}">${x.o.map(o=>`<option value="${esc(o[0])}"${o[0]==x.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${x.k}" type="${x.t||'text'}" value="${esc(x.v||'')}" autocomplete="${x.a||'off'}">`)).join('')+`<div class="bt"><button type="button" onclick="this.closest('dialog').close('x')">Annuler</button>${del?'<button type="button" onclick="this.closest(\'dialog\').close(\'d\')">Supprimer</button>':''}<button class="ok" value="ok">OK</button></div></form>`;
 d.onclose=()=>{const v=d.returnValue,o={};d.querySelectorAll('[name]').forEach(i=>o[i.name]=i.value);d.remove();res(v=='ok'?o:v=='d'?{...o,_d:1}:null)};
 document.body.append(d);d.showModal();const i=d.querySelector('input');i&&i.focus()})}
/* arbre */
const CL=[['','Aucune'],['#ff5c7a','Rouge'],['#ff9f43','Orange'],['#f7d154','Jaune'],['#4cd98a','Vert'],['#4ccfe0','Cyan'],['#7c5cff','Violet'],['#ff7ad9','Rose']];
const row=(h,d,c,k,a)=>`<div class="r${a?' a':''}" data-k="${k}" style="padding-left:${10+d*16}px;border-left-color:${c||'transparent'}">${h}</div>`;
function tree(p,d,o){
 live(S.folders).filter(x=>(x.parent||null)===p).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{
  const op=open.has(f.id),lk=f.vault&&!keys[f.id];
  o.push(row(`<span class="ch${op&&!lk?' o':''}"></span>${f.emoji||''}<b>${esc(f.name)}</b>${f.vault?LK(lk,f.id):''}<i data-e="f:${f.id}">⋯</i>`,d,f.color,'f:'+f.id,sel===f.id));
  if(op&&!lk)tree(f.id,d+1,o)});
 live(S.notes).filter(x=>(x.folder||null)===p).sort((a,b)=>b.updated-a.updated).forEach(n=>
  o.push(row(`${n.emoji||''}<b>${esc(T(n))||'Sans titre'}</b><i data-e="n:${n.id}">⋯</i>`,d,n.color,'n:'+n.id,cur===n.id)))}
function render(){const o=[],q=($('#sq').value||'').trim().toLowerCase();
 if(q)live(S.notes).filter(n=>(!vk(n)||pl[n.id])&&(T(n)+' '+B(n).replace(/<[^>]+>/g,' ')).toLowerCase().includes(q)).forEach(n=>o.push(row(`${n.emoji||''}<b>${esc(T(n))||'Sans titre'}</b>`,0,n.color,'n:'+n.id,cur===n.id)));else tree(null,0,o);
 $('#tree').innerHTML=o.join('')||'<p style="color:var(--mu);padding:14px">Aucune note pour l\'instant. Appuie sur « Note » pour commencer.</p>'}
$('#tree').onclick=async e=>{const lq=e.target.closest('[data-lk]');if(lq&&keys[lq.dataset.lk]){e.stopPropagation();return lockV(lq.dataset.lk)}const x=e.target.closest('[data-e]'),r=e.target.closest('.r');
 if(x){e.stopPropagation();return edit(x.dataset.e)}if(!r)return;const[t,i]=r.dataset.k.split(':');
 if(t=='n')return go(i);sel=i;const f=S.folders[i];
 if(f.vault&&!keys[i]){if(await unlock(i))open.add(i)}else open.has(i)?open.delete(i):open.add(i);render()};
async function goLink(i){const n=S.notes[i];if(!n||n.deleted)return;const v=vk(n);if(v&&(!cur||vk(S.notes[cur])!==v)&&!await unlock(v))return;openNote(i)}
async function go(i){const n=S.notes[i];if(!n||n.deleted)return;const v=vk(n);if(v&&!keys[v]&&!await unlock(v))return;openNote(i)}
/* coffres */
async function unlock(v){const f=S.folders[v],r=await ask('Ouvrir « '+f.name+' »',[{k:'p',l:'Mot de passe',t:'password'}]);if(!r)return false;
 try{const k=await mk(r.p,f.salt);if(await D(k,f.check)!=='ok')throw 0;keys[v]=k;
  for(const n of Object.values(S.notes))if(!n.purged&&vid(n.folder)==v&&n.enc)try{pl[n.id]=JSON.parse(await D(k,n.enc))}catch(e){}return true}
 catch(e){toast('Mot de passe incorrect');return false}}
function lockAll(){flush();keys={};pl={};if(cur&&vk(S.notes[cur]))closeEd();render();toast('Coffres verrouillés')}
const lockQ=v=>{delete keys[v];Object.values(S.notes).forEach(n=>{if(vid(n.folder)==v)delete pl[n.id]})};
function lockV(v){flush();lockQ(v);if(cur&&vk(S.notes[cur])==v)closeEd();else render();toast('Coffre verrouillé')}
const LK=(lk,id)=>`<svg class="lk" viewBox="0 0 24 24" data-lk="${id}"${lk?'':' style="stroke:var(--ac)"'}><rect x="5" y="11" width="14" height="9" rx="2"/><path d="${lk?'M8 11V8a4 4 0 0 1 8 0v3':'M8 11V8a4 4 0 0 1 7-2.6'}"/></svg>`;
async function changePw(v){const f=S.folders[v];let err='';
 for(;;){const r=await ask('Changer le mot de passe'+(err?' — '+err:''),[{k:'c',l:'Mot de passe actuel',t:'password',a:'current-password'},{k:'n',l:'Nouveau mot de passe',t:'password',a:'new-password'},{k:'m',l:'Répéter le nouveau',t:'password',a:'new-password'}]);
  if(!r)return;if(!r.n){err='nouveau mot de passe vide';continue}if(r.n!==r.m){err='les deux ne correspondent pas';continue}
  let k;try{k=await mk(r.c,f.salt);if(await D(k,f.check)!=='ok')throw 0}catch(e){err='mot de passe actuel incorrect';continue}
  keys[v]=k;const ns=Object.values(S.notes).filter(n=>!n.purged&&vid(n.folder)==v);
  for(const n of ns)if(n.enc)try{pl[n.id]=JSON.parse(await D(k,n.enc))}catch(e){}
  if(ns.some(n=>n.enc&&!pl[n.id])){toast('Une note ne peut pas être déchiffrée : mot de passe non changé');return}
  await rekey(v,r.n);render();toast('Mot de passe changé');return}}
async function verify(v){const f=S.folders[v],r=await ask('Mot de passe de « '+f.name+' »',[{k:'p',l:'Mot de passe',t:'password'}]);if(!r)return false;
 try{if(await D(await mk(r.p,f.salt),f.check)==='ok')return true}catch(e){}toast('Mot de passe incorrect');return false}
async function newVault(){const r=await ask('Nouveau coffre',[{k:'n',l:'Nom'},{k:'p',l:'Mot de passe (impossible à récupérer)',t:'password'}]);if(!r||!r.n||!r.p)return;
 const salt=b64(crypto.getRandomValues(new Uint8Array(16))),k=await mk(r.p,salt),f={id:uid(),name:r.n,vault:true,salt,check:await E(k,'ok'),parent:null,updated:now()};
 S.folders[f.id]=f;keys[f.id]=k;open.add(f.id);save();render()}
/* création */
function okSel(){const v=vid(sel);if(v&&!keys[v]){toast('Coffre verrouillé');return false}return true}
async function newNote(){if(!okSel())return;const n={id:uid(),title:'',body:'',folder:sel,updated:now()};if(vk(n))pl[n.id]={t:'',b:''};S.notes[n.id]=n;await put(n);if(sel)open.add(sel);openNote(n.id);$('#ti').focus()}
async function newFolder(){if(!okSel())return;const r=await ask('Nouveau dossier',[{k:'n',l:'Nom'},{k:'e',l:'Emoji (facultatif)'}]);if(!r||!r.n)return;
 const f={id:uid(),name:r.n,emoji:r.e,parent:sel,updated:now()};S.folders[f.id]=f;if(sel)open.add(sel);save();render()}
async function put(n){n.updated=now();const v=vk(n);if(v&&keys[v]){n.enc=await E(keys[v],JSON.stringify(pl[n.id]));n.title='';n.body=''}save()}
/* modifier / déplacer / supprimer */
async function edit(k){const[t,i]=k.split(':'),o=t=='f'?S.folders[i]:S.notes[i],cf=t=='f'?o.parent:o.folder;
 const opts=[['','Racine'],...live(S.folders).filter(f=>!(t=='f'&&(f.id==i||sub(i).has(f.id)))).map(f=>[f.id,f.name])];
 const fl=[...(t=='f'?[{k:'n',l:'Nom',v:o.name}]:[]),{k:'e',l:'Emoji',v:o.emoji},{k:'c',l:'Couleur',o:CL,v:o.color||''}];
 if(!o.vault)fl.push({k:'to',l:'Dans le dossier',o:opts,v:cf||''});else fl.push({k:'act',l:'Mot de passe du coffre',o:[['','Ne pas changer'],['pw','Changer le mot de passe…']]});
 const r=await ask(t=='f'?'Dossier':'Note',fl,true);if(!r)return;
 if(r._d){if(o.vault&&!await verify(i))return;if(!confirm('Mettre à la corbeille ?'))return;const fs=t=='f'?[i,...sub(i)]:[];
  fs.forEach(x=>{S.folders[x].deleted=1;S.folders[x].updated=now()});
  live(S.notes).filter(n=>n.id==i&&t=='n'||fs.includes(n.folder)).forEach(n=>{n.deleted=1;n.updated=now();if(n.id==cur)closeEd()});if(o.vault)lockQ(i);save();return render()}
 if(!o.vault&&(r.to||null)!==(cf||null)){if(vid(r.to||null)!==vid(cf||null))toast('Déplacement impossible entre un coffre et l\'extérieur');else{if(t=='f')o.parent=r.to||null;else o.folder=r.to||null}}
 if(r.act=='pw')await changePw(i);if(r.n)o.name=r.n;o.emoji=r.e;o.color=r.c;o.updated=now();save();render()}
async function rekey(v,pw){const f=S.folders[v],salt=b64(crypto.getRandomValues(new Uint8Array(16))),k=await mk(pw,salt);f.salt=salt;f.check=await E(k,'ok');keys[v]=k;
 for(const n of Object.values(S.notes))if(!n.purged&&vid(n.folder)==v&&pl[n.id]){n.enc=await E(k,JSON.stringify(pl[n.id]));n.updated=now()}f.updated=now();save()}
/* corbeille */
const dsub=i=>{const s=new Set(),w=p=>Object.values(S.folders).filter(f=>f.parent==p&&!f.purged).forEach(f=>{s.add(f.id);w(f.id)});w(i);return s};
async function trash(){const it=[...Object.values(S.folders).filter(x=>x.deleted&&!x.purged).map(x=>['f:'+x.id,(x.emoji?x.emoji+' ':'')+x.name]),...Object.values(S.notes).filter(x=>x.deleted&&!x.purged).map(x=>['n:'+x.id,(x.emoji?x.emoji+' ':'')+(T(x)||'Note')])];
 if(!it.length)return toast('Corbeille vide');
 const r=await ask('Corbeille : OK restaure, Supprimer efface pour de bon',[{k:'i',l:'Élément',o:[['*','Toute la corbeille'],...it]}],true);if(!r)return;
 const ks=r.i=='*'?it.map(x=>x[0]):[r.i];
 if(r._d){for(const k of ks){const[t,i]=k.split(':');if(t=='f'&&S.folders[i].vault&&!await verify(i))return}if(!confirm('Effacer définitivement ?'))return;ks.forEach(k=>{const[t,i]=k.split(':'),o=(t=='f'?S.folders:S.notes)[i];Object.assign(o,{deleted:1,purged:1,updated:now(),title:'',body:'',enc:'',name:'',salt:'',check:''})})}
 else ks.forEach(k=>{const[t,i]=k.split(':'),a=t=='f'?[i,...dsub(i)]:[];
  a.forEach(x=>{const f=S.folders[x];f.deleted=0;f.updated=now()});
  Object.values(S.notes).filter(n=>!n.purged&&(a.includes(n.folder)||(t=='n'&&n.id==i))).forEach(n=>{n.deleted=0;n.updated=now()});
  let p=S.folders[t=='f'?i:S.notes[i].folder];while(p&&p.deleted&&!p.purged){p.deleted=0;p.updated=now();p=S.folders[p.parent]}});
 save();render()}
/* éditeur */
function clean(h){const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,iframe,object,embed,style,link,meta').forEach(e=>e.remove());
 t.content.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))e.removeAttribute(a.name)}));return t.innerHTML}
function openNote(i){flush();cur=i;const n=S.notes[i];$('#ph').style.display='none';$('#ew').style.display='block';
 $('#ti').value=T(n);$('#bd').innerHTML=clean(B(n));
 $('#bd').querySelectorAll('a.wl').forEach(a=>{const x=S.notes[a.dataset.id];a.textContent=x&&!x.deleted?(vk(x)&&!pl[x.id]?'Note protégée':T(x)||'Sans titre'):'(supprimée)'});
 const bk=live(S.notes).filter(x=>x.id!==i&&B(x).includes(`data-id="${i}"`));
 $('#bl').innerHTML=bk.length?'Liée depuis :<br>'+bk.map(x=>`<div data-id="${x.id}">${esc(T(x)||'Sans titre')}</div>`).join(''):'';

 e.style.display='block';e.style.left=Math.max(8,Math.min(r.left,innerWidth-240))+'px';e.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-270))+'px'}

 const s=getSelection();s.removeAllRanges();s.addRange(r);ctx=null;menu();const x=c[1],ex=(c,v)=>document.execCommand(c,false,v);

 else if(x=='chk')ex('insertHTML','<div class="ci"><span class="chk" contenteditable="false"></span>&nbsp;</div>');
 else if(x=='date')ex('insertText',new Date().toLocaleDateString('fr-BE',{dateStyle:'full'}));

 onInput()}

function unci(ci,s){ci.querySelectorAll('.chk').forEach(c=>c.remove());ci.removeAttribute('class');const t=ci.firstChild;if(t&&t.nodeType==3)t.textContent=t.textContent.replace(/^\u00a0/,'');
