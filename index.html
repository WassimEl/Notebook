<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="manifest" href="./manifest.json">
<title>Carnet — notes personnelles</title>
<style>
:root{--bg:#f7f5f0;--panel:#fffefa;--paper:#fffefa;--ink:#292923;--muted:#89877e;--line:#e9e5dc;--accent:#65735b;--accent-soft:#e8ede3;--shadow:0 8px 30px #2929230a;--radius:17px}
[data-theme="dark"]{--bg:#20211f;--panel:#282a27;--paper:#292b28;--ink:#eeeDE6;--muted:#a6a69b;--line:#41433e;--accent:#b5c4a5;--accent-soft:#394336;--shadow:0 8px 30px #0002}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh;max-width:1600px;margin:auto}.sidebar{padding:25px 16px;border-right:1px solid var(--line);background:var(--panel);height:100vh;position:sticky;top:0;overflow:auto}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.4px;padding:4px 9px 24px}.brandmark{width:31px;height:31px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:17px}.search{width:100%;border:1px solid var(--line);background:var(--bg);padding:10px 12px;border-radius:11px;margin-bottom:17px}.side-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:14px 10px 7px;font-weight:700}.navitem,.treeitem{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;border-radius:10px;color:var(--muted);font-size:14px}.navitem:hover,.treeitem:hover{background:var(--bg);color:var(--ink)}.navitem.active,.treeitem.active{background:var(--accent-soft);color:var(--ink)}.navitem .count{margin-left:auto;font-size:11px}.folder-tree{font-size:14px}.treeitem{padding-top:7px;padding-bottom:7px}.treeitem .folder-actions{margin-left:auto;opacity:0}.treeitem:hover .folder-actions{opacity:1}.small-icon{font-size:12px;color:var(--muted);padding:2px}.sidebar-bottom{margin-top:26px;border-top:1px solid var(--line);padding-top:13px}.syncnote{font-size:11px;color:var(--muted);padding:10px;line-height:1.45}
.main{min-width:0;display:flex;flex-direction:column}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,52px);border-bottom:1px solid var(--line);gap:12px}.crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:7px;align-items:center}.btn{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--panel);font-size:13px;white-space:nowrap}.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.icon{width:37px;height:37px;padding:0;display:grid;place-items:center;font-size:17px}.content{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);flex:1;min-height:0}.listpane{border-right:1px solid var(--line);padding:22px 13px;min-width:0}.listhead{display:flex;align-items:center;justify-content:space-between;padding:0 7px 13px}.listhead h2{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0}.note-card{padding:13px 13px;margin:4px 0;border-radius:12px;cursor:pointer;border:1px solid transparent}.note-card:hover{background:var(--bg)}.note-card.active{background:var(--accent-soft);border-color:transparent}.note-title{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.note-meta{font-size:10px;color:var(--muted);margin-top:8px;display:flex;gap:7px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}.editor-wrap{min-width:0;max-width:920px;width:100%;margin:0 auto;padding:clamp(22px,5vw,65px) clamp(20px,6vw,78px) 100px}.editor-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:24px}.editor-tools .btn{padding:6px 9px;font-size:12px}.editor-tools .spacer{flex:1}.note-emoji{font-size:26px;width:40px;text-align:center;border:0;background:transparent;outline:none}.title-input{font-size:clamp(27px,4vw,39px);line-height:1.2;font-weight:750;letter-spacing:-1.4px;border:0;background:transparent;width:100%;outline:none;margin:4px 0 10px}.title-input::placeholder{color:var(--muted)}.metadata{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:13px 0 27px}.pill{font-size:11px;border:1px solid var(--line);padding:4px 8px;border-radius:99px;color:var(--muted);background:var(--panel)}.taginput{border:0;background:transparent;min-width:90px;width:100px;font-size:12px;outline:none}.editor{outline:none;min-height:45vh;font-size:16px;line-height:1.8;overflow-wrap:anywhere}.editor:empty:before{content:"Commence à écrire…";color:var(--muted);pointer-events:none}.editor h1,.editor h2,.editor h3{line-height:1.3;letter-spacing:-.5px;margin:1.5em 0 .55em}.editor h1{font-size:1.8em}.editor h2{font-size:1.4em}.editor p{margin:.5em 0}.editor blockquote{border-left:3px solid var(--accent);margin:18px 0;padding:4px 0 4px 17px;color:var(--muted)}.editor table{border-collapse:collapse;width:100%;font-size:14px;margin:20px 0}.editor td,.editor th{border:1px solid var(--line);padding:8px 10px;min-width:80px}.editor th{background:var(--bg);text-align:left}.editor a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.editor ul,.editor ol{padding-left:1.5em}.editor img{max-width:100%;border-radius:12px}.statusline{font-size:11px;color:var(--muted);margin-top:32px}.empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:13px}.empty .big{font-size:27px;margin-bottom:10px}.mobile-menu{display:none}.folder-row{display:flex;align-items:center;gap:6px}.modal-backdrop{position:fixed;inset:0;background:#1118;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.modal h3{margin:0 0 8px;font-size:18px}.modal p{font-size:13px;color:var(--muted)}.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:7px 0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.hidden{display:none!important}.tag{background:var(--accent-soft);border-radius:5px;padding:2px 5px;font-size:10px}.mobile-bottom{display:none}
@media(max-width:800px){.app{display:block}.sidebar{display:none;position:fixed;z-index:5;inset:0 auto 0 0;width:min(310px,86vw);box-shadow:var(--shadow)}.sidebar.open{display:block}.topbar{height:58px;padding:0 13px}.mobile-menu{display:grid}.topbar .desktop-only{display:none}.content{display:block}.listpane{border-right:0;padding:14px 13px 0;max-height:34vh;overflow:auto;border-bottom:1px solid var(--line)}.listhead{padding-bottom:7px}.note-card{padding:10px 11px;display:inline-block;vertical-align:top;width:min(225px,70vw);margin-right:4px}.note-card .note-preview{max-width:190px}.editor-wrap{padding:22px 20px 95px}.title-input{font-size:29px}.editor{min-height:38vh}.editor-tools{margin-bottom:17px}.mobile-bottom{display:flex;position:fixed;bottom:0;left:0;right:0;padding:9px 13px calc(9px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--panel) 94%,transparent);border-top:1px solid var(--line);justify-content:space-around;z-index:4;backdrop-filter:blur(15px)}.mobile-bottom button{font-size:11px;color:var(--muted);padding:4px 8px}.mobile-bottom button strong{display:block;font-size:18px;font-weight:500;color:var(--ink)}.statusline{margin-bottom:35px}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brandmark">✳</span><span>Carnet</span></div>
  <input class="search" id="search" placeholder="⌕  Rechercher…" aria-label="Rechercher dans les notes">
  <button class="navitem active" data-filter="all">✧ <span>Toutes les notes</span><span class="count" id="allCount"></span></button>
  <button class="navitem" data-filter="inbox">↳ <span>Boîte de réception</span></button>
  <button class="navitem" data-filter="favorites">☆ <span>Favoris</span></button>
  <button class="navitem" data-filter="locked">♙ <span>Notes protégées</span></button>
  <div class="side-label">Espaces</div>
  <div id="folderTree" class="folder-tree"></div>
  <button class="navitem" id="newFolder">＋ <span>Nouveau dossier</span></button>
  <div class="sidebar-bottom">
    <button class="navitem" id="exportBtn">⇩ <span>Exporter mes données</span></button>
    <button class="navitem" id="importBtn">⇧ <span>Importer une sauvegarde</span></button>
    <button class="navitem" id="themeBtn">◐ <span>Changer le thème</span></button>
    <div class="syncnote">Stockage local sur cet appareil.<br>Exportez régulièrement une sauvegarde.</div>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="btn icon mobile-menu" id="menuBtn" aria-label="Ouvrir le menu">☰</button><div class="crumb" id="crumb">Mon espace / Toutes les notes</div></div>
    <div class="actions"><button class="btn desktop-only" id="linkBtn">↗ Lier une note</button><button class="btn desktop-only" id="dictateBtn">🎙 Dictée</button><button class="btn primary" id="newNoteBtn">＋ Nouvelle note</button></div>
  </header>
  <div class="content">
    <section class="listpane">
      <div class="listhead"><h2 id="listHeading">Récentes</h2><button class="small-icon" id="sortBtn" title="Trier">↕</button></div>
      <div id="noteList"></div>
    </section>
    <section class="editor-wrap" id="editorWrap">
      <div id="editorEmpty" class="empty"><div class="big">✎</div><strong>Un peu d'espace pour tes idées.</strong><p>Choisis une note ou commence-en une nouvelle.</p><button class="btn primary" id="emptyNew">Créer une note</button></div>
      <div id="editorUI" class="hidden">
        <div class="editor-tools">
          <button class="btn" id="emojiBtn" title="Choisir un emoji">✳ Emoji</button>
          <button class="btn" id="colorBtn" title="Couleur de la note">◉ Couleur</button>
          <button class="btn" id="tableBtn">▦ Tableau</button>
          <button class="btn" id="checkBtn">☑ Liste</button>
          <button class="btn" id="quoteBtn">❞ Citation</button>
          <span class="spacer"></span>
          <button class="btn" id="favoriteBtn" title="Favori">☆</button>
          <button class="btn" id="lockBtn" title="Protéger cette note">♙</button>
          <button class="btn" id="moreBtn" title="Plus d'actions">•••</button>
        </div>
        <div style="display:flex;align-items:center;gap:5px"><input class="note-emoji" id="noteEmoji" value="📝" aria-label="Emoji de la note"><input id="title" class="title-input" placeholder="Titre de la note" maxlength="180"></div>
        <div class="metadata"><span class="pill" id="folderPill">Boîte de réception</span><button class="pill" id="moveBtn">Déplacer</button><span class="pill" id="datePill">À l'instant</span><input class="taginput" id="tags" placeholder="+ ajouter des tags (virgules)"></div>
        <div class="editor" id="editor" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Contenu de la note"></div>
        <div class="statusline" id="saveStatus">Enregistré sur cet appareil</div>
      </div>
    </section>
  </div>
</main>
</div>
<nav class="mobile-bottom">
  <button id="mobileHome"><strong>⌂</strong>Notes</button><button id="mobileSearch"><strong>⌕</strong>Rechercher</button><button id="mobileNew"><strong>＋</strong>Nouvelle</button><button id="mobileFolders"><strong>▤</strong>Dossiers</button>
</nav>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div id="modalRoot"></div>
<script>
(() => {
const KEY='carnet-v1-data', SETTINGS='carnet-v1-settings';
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const now=()=>new Date().toISOString();
let data={notes:[],folders:[{id:'inbox',name:'Boîte de réception',parentId:null,emoji:'📥',color:'#9b9a91'}]};
let currentId=null, filter='all', folderFilter=null, query='', sortNewest=true, recognition=null, saveTimer=null, unlocked=new Map();
let settings={theme:'light'};
try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}}catch{}
document.documentElement.dataset.theme=settings.theme==='dark'?'dark':'light';
function snapshotData(){return {...data,notes:data.notes.map(n=>n.locked&&unlocked.has(n.id)?{...n,title:'Note protégée',content:'',emoji:'🔒',tags:[]}:{...n})}}\nfunction saveData(){try{const safe=snapshotData();localStorage.setItem(KEY,JSON.stringify(safe));$('saveStatus').textContent='Enregistré sur cet appareil · '+new Date().toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})}catch(e){$('saveStatus').textContent='Espace de stockage insuffisant — exporte tes données';console.error(e)}}
function saveSettings(){localStorage.setItem(SETTINGS,JSON.stringify(settings))}
function loadData(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.notes)&&Array.isArray(d.folders))data=d}catch(e){console.warn(e)}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function plain(html=''){const el=document.createElement('div');el.innerHTML=html;return (el.innerText||el.textContent||'').replace(/\s+/g,' ').trim()}
function current(){return data.notes.find(n=>n.id===currentId)}
function folderName(id){return data.folders.find(f=>f.id===id)?.name||'Boîte de réception'}
function fmtDate(s){try{return new Date(s).toLocaleDateString('fr-BE',{day:'numeric',month:'short'})}catch{return ''}}
function modal(title,desc,fields,actionLabel,action){const root=$('modalRoot');root.innerHTML='';const back=document.createElement('div');back.className='modal-backdrop';back.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(desc||'')}</p><form id="modalForm">${fields}<div class="modal-actions"><button type="button" class="btn" id="cancelModal">Annuler</button><button class="btn primary" type="submit">${esc(actionLabel||'Valider')}</button></div></form></div>`;root.append(back);$('cancelModal').onclick=()=>root.innerHTML='';back.addEventListener('click',e=>{if(e.target===back)root.innerHTML=''});$('modalForm').onsubmit=e=>{e.preventDefault();const result=action(new FormData(e.target),e.target);if(result!==false)root.innerHTML=''};back.querySelector('input,select')?.focus()}
function folderOptions(selected='inbox',includeInbox=true){return data.folders.filter(f=>includeInbox||f.id!=='inbox').map(f=>`<option value="${esc(f.id)}" ${f.id===selected?'selected':''}>${esc(f.emoji||'📁')} ${esc(f.name)}</option>`).join('')}
function renderFolders(){const tree=$('folderTree');tree.innerHTML='';const build=(parent,depth)=>data.folders.filter(f=>f.parentId===parent&&f.id!=='inbox').forEach(f=>{const b=document.createElement('button');b.className='treeitem'+(folderFilter===f.id?' active':'');b.style.paddingLeft=(10+depth*15)+'px';b.innerHTML=`<span>${esc(f.emoji||'📁')}</span><span style="overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</span><span class="folder-actions small-icon" title="Options">•••</span>`;b.onclick=e=>{if(e.target.closest('.folder-actions')){folderMenu(f.id);return}folderFilter=f.id;filter='folder';renderAll();if(innerWidth<=800)$('sidebar').classList.remove('open')};tree.append(b);build(f.id,depth+1)});build(null,0)}
function folderMenu(id){const f=data.folders.find(x=>x.id===id);if(!f)return;modal('Options du dossier',f.name,`<label>Nom</label><input name="name" value="${esc(f.name)}" required><label>Emoji</label><input name="emoji" value="${esc(f.emoji||'📁')}" maxlength="8"><label>Couleur</label><input name="color" type="color" value="${esc(f.color||'#9b9a91')}"><label>Placer dans</label><select name="parent">${`<option value="">Aucun dossier parent</option>`+data.folders.filter(x=>x.id!==id&&!isDescendant(x.id,id)).map(x=>`<option value="${esc(x.id)}" ${x.id===f.parentId?'selected':''}>${esc(x.emoji||'📁')} ${esc(x.name)}</option>`).join('')}</select>`,`Enregistrer`,fd=>{f.name=fd.get('name').trim();f.emoji=fd.get('emoji')||'📁';f.color=fd.get('color');f.parentId||null;f.parentId=fd.get('parent')||null;saveData();renderAll()})}
function isDescendant(possible,ancestor){let f=data.folders.find(x=>x.id===possible);while(f){if(f.parentId===ancestor)return true;f=data.folders.find(x=>x.id===f.parentId)}return false}
function createFolder(){modal('Créer un dossier','Organise tes notes avec des dossiers imbriqués.',`<label>Nom du dossier</label><input name="name" placeholder="Ex. Travail, Idées…" required><label>Emoji</label><input name="emoji" value="📁" maxlength="8"><label>Couleur</label><input name="color" type="color" value="#8c9b7d"><label>Dossier parent</label><select name="parent"><option value="">À la racine</option>${folderOptions('',false)}</select>`,'Créer',fd=>{const name=fd.get('name').trim();if(!name)return false;const f={id:uid(),name,emoji:fd.get('emoji')||'📁',color:fd.get('color'),parentId:fd.get('parent')||null};data.folders.push(f);saveData();renderAll()})}
function createNote(){const n={id:uid(),title:'',content:'',emoji:'📝',folderId:folderFilter&&folderFilter!=='inbox'?folderFilter:'inbox',tags:[],color:'#ffffff',favorite:false,locked:false,createdAt:now(),updatedAt:now()};data.notes.unshift(n);currentId=n.id;filter='all';folderFilter=null;saveData();renderAll();$('title').focus()}
function visibleNotes(){let ns=data.notes.filter(n=>!n.deleted);if(filter==='favorites')ns=ns.filter(n=>n.favorite);else if(filter==='locked')ns=ns.filter(n=>n.locked);else if(filter==='inbox')ns=ns.filter(n=>n.folderId==='inbox');else if(filter==='folder'&&folderFilter)ns=ns.filter(n=>n.folderId===folderFilter||isDescendant(n.folderId,folderFilter));if(query){const q=query.toLocaleLowerCase();ns=ns.filter(n=>(n.locked?'':(n.title+' '+plain(n.content)+' '+(n.tags||[]).join(' '))).toLocaleLowerCase().includes(q)||n.locked&&'note protégée'.includes(q))}ns.sort((a,b)=>sortNewest?b.updatedAt.localeCompare(a.updatedAt):a.title.localeCompare(b.title));return ns}
function renderList(){const list=$('noteList'),ns=visibleNotes();$('allCount').textContent=data.notes.filter(n=>!n.deleted).length;$('listHeading').textContent=query?'Résultats':filter==='favorites'?'Favoris':filter==='locked'?'Protégées':filter==='inbox'?'À classer':filter==='folder'?folderName(folderFilter):'Récentes';list.innerHTML='';if(!ns.length){list.innerHTML='<div class="empty">Aucune note ici pour le moment.</div>';return}ns.forEach(n=>{const b=document.createElement('div');b.className='note-card'+(n.id===currentId?' active':'');b.style.borderLeft=n.color&&n.color!=='#ffffff'?`3px solid ${n.color}`:'';b.innerHTML=`<div class="note-title">${esc(n.emoji||'📝')} ${esc(n.locked?'Note protégée':n.title||'Sans titre')}${n.favorite?' <span style="color:var(--accent)">☆</span>':''}</div><div class="note-preview">${esc(n.locked?'Contenu verrouillé':plain(n.content)||'Pas encore de contenu')}</div><div class="note-meta"><span>${esc(folderName(n.folderId))}</span><span>· ${fmtDate(n.updatedAt)}</span></div>`;b.onclick=()=>{currentId=n.id;renderAll()};list.append(b)})}
function renderEditor(){const n=current();$('editorEmpty').classList.toggle('hidden',!!n);$('editorUI').classList.toggle('hidden',!n);if(!n)return;const isUnlocked=!n.locked||unlocked.has(n.id);$('title').disabled=!isUnlocked;$('noteEmoji').disabled=!isUnlocked;$('tags').disabled=!isUnlocked;$('editor').contentEditable=String(isUnlocked);$('title').value=isUnlocked?n.title:'Note protégée 🔒';$('noteEmoji').value=isUnlocked?(n.emoji||'📝'):'🔒';$('tags').value=isUnlocked?(n.tags||[]).join(', '):'';$('editor').innerHTML=isUnlocked?(n.content||''): '<p style="color:var(--muted)">Cette note est protégée. Déverrouille-la pour lire ou modifier son contenu.</p>';$('folderPill').textContent=folderName(n.folderId);$('datePill').textContent='Modifiée '+fmtDate(n.updatedAt);$('favoriteBtn').textContent=n.favorite?'★':'☆';$('lockBtn').textContent=n.locked?'🔓 Déverrouiller':'♙ Protéger';$('lockBtn').classList.toggle('primary',n.locked);$('saveStatus').textContent=n.locked&&!isUnlocked?'Note protégée':'Enregistré sur cet appareil';$('crumb').textContent='Mon espace / '+folderName(n.folderId)+' / '+(n.title||'Nouvelle note')}
function renderAll(){renderFolders();renderList();renderEditor();document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));}
function scheduleSave(){const n=current();if(!n||n.locked)return;$('saveStatus').textContent='Enregistrement…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const x=current();if(!x)return;x.title=$('title').value;x.emoji=$('noteEmoji').value||'📝';x.content=$('editor').innerHTML;x.tags=$('tags').value.split(',').map(t=>t.trim()).filter(Boolean);x.updatedAt=now();saveData();renderList();$('datePill').textContent='Modifiée '+fmtDate(x.updatedAt);$('crumb').textContent='Mon espace / '+folderName(x.folderId)+' / '+(x.title||'Nouvelle note')},250)}
function insertAtCursor(html){$('editor').focus();document.execCommand('insertHTML',false,html);scheduleSave()}
function addTable(){insertAtCursor('<table><thead><tr><th>Colonne 1</th><th>Colonne 2</th><th>Colonne 3</th></tr></thead><tbody><tr><td>Élément</td><td>Valeur</td><td>Notes</td></tr><tr><td></td><td></td><td></td></tr></tbody></table><p><br></p>')}
function addCheck(){insertAtCursor('<ul><li><input type="checkbox"> Tâche à faire</li></ul><p><br></p>')}
function addQuote(){insertAtCursor('<blockquote>Une idée à retenir…</blockquote><p><br></p>')}
function addLink(){const n=current();if(!n)return;const opts=data.notes.filter(x=>x.id!==n.id&&!x.locked).map(x=>`<option value="${esc(x.id)}">${esc(x.emoji||'📝')} ${esc(x.title||'Sans titre')}</option>`).join('');if(!opts){alert('Crée d’abord une autre note à lier.');return}modal('Créer un lien vers une note','Le lien ouvrira la note choisie dans ton carnet.',`<label>Note cible</label><select name="target" required>${opts}</select><label>Texte du lien (facultatif)</label><input name="label" placeholder="Nom de la note">`,'Insérer',fd=>{const target=fd.get('target'),dest=data.notes.find(x=>x.id===target),label=fd.get('label').trim()||dest.title||'Ouvrir la note';insertAtCursor(`<a href="#" data-note-id="${esc(target)}">${esc(label)}</a>&nbsp;`);})}
function moveNote(){const n=current();if(!n)return;modal('Déplacer la note','Choisis le dossier de destination.',`<label>Dossier</label><select name="folder">${folderOptions(n.folderId)}</select>`,'Déplacer',fd=>{n.folderId=fd.get('folder');n.updatedAt=now();saveData();renderAll()})}
async function deriveKey(password,salt){const enc=new TextEncoder();const keymat=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},keymat,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function protectNote(){const n=current();if(!n)return;if(n.locked){unlockNote();return}const fields=`<label>Mot de passe de cette note</label><input name="pw" type="password" minlength="6" required autocomplete="new-password"><label>Confirmer le mot de passe</label><input name="confirm" type="password" minlength="6" required autocomplete="new-password">`;modal('Protéger cette note','Le contenu et le titre seront chiffrés dans le stockage local. Si tu oublies le mot de passe, il n’y a pas de récupération.',fields,'Chiffrer',async fd=>{const pw=fd.get('pw');if(pw!==fd.get('confirm')){alert('Les mots de passe ne correspondent pas.');return false}try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(pw,salt),payload=JSON.stringify({title:n.title,content:n.content,emoji:n.emoji,tags:n.tags});const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(payload));n.cipher={salt:b64(salt),iv:b64(iv),data:b64(cipher)};n.locked=true;n.title='Note protégée';n.content='';n.emoji='🔒';n.tags=[];unlocked.delete(n.id);saveData();renderAll()}catch(e){alert('Le chiffrement n’a pas fonctionné dans ce navigateur. Ouvre le site en HTTPS.');console.error(e)}})}
async function unlockNote(){const n=current();if(!n||!n.locked)return;modal('Déverrouiller la note','Le mot de passe ne sera pas conservé.',`<label>Mot de passe</label><input name="pw" type="password" required autocomplete="current-password">`,'Déverrouiller',async fd=>{try{const key=await deriveKey(fd.get('pw'),unb64(n.cipher.salt));const plainbuf=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(n.cipher.iv)},key,unb64(n.cipher.data));const p=JSON.parse(new TextDecoder().decode(plainbuf));n.title=p.title;n.content=p.content;n.emoji=p.emoji;n.tags=p.tags;unlocked.set(n.id,true);renderAll()}catch(e){alert('Mot de passe incorrect ou note illisible.');return false}})}
async function relockIfNeeded(){const n=current();if(n&&n.locked&&unlocked.has(n.id)){const pw=prompt('Pour reverrouiller cette note, saisis son mot de passe :');if(pw===null)return;try{const oldKey=await deriveKey(pw,unb64(n.cipher.salt));await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(n.cipher.iv)},oldKey,unb64(n.cipher.data));const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(pw,salt),payload=JSON.stringify({title:n.title,content:n.content,emoji:n.emoji,tags:n.tags}),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(payload));n.cipher={salt:b64(salt),iv:b64(iv),data:b64(cipher)};n.title='Note protégée';n.content='';n.emoji='🔒';n.tags=[];unlocked.delete(n.id);saveData();renderAll()}catch(e){alert('Mot de passe incorrect ou erreur de chiffrement.')}}}
function exportData(){const blob=new Blob([JSON.stringify({format:'carnet-backup-v1',exportedAt:now(),data:snapshotData()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carnet-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),d=parsed.data||parsed;if(!Array.isArray(d.notes)||!Array.isArray(d.folders))throw Error('Format');if(!confirm('Importer cette sauvegarde remplacera les notes actuellement présentes sur cet appareil. As-tu exporté une sauvegarde de sécurité ?'))return;data=d;currentId=null;saveData();renderAll();alert('Sauvegarde importée.')}catch(e){alert('Fichier de sauvegarde invalide.')}};reader.readAsText(file)}
function dictate(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('La dictée vocale n’est pas disponible dans ce navigateur. Utilise la dictée du clavier iOS (micro du clavier) ou essaie Safari à jour.');return}if(recognition){recognition.stop();recognition=null;$('dictateBtn').textContent='🎙 Dictée';return}recognition=new SR();recognition.lang='fr-FR';recognition.interimResults=true;recognition.continuous=true;let finalText='';recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript}if(finalText||interim){$('editor').focus();$('editor').innerText=($('editor').innerText.replace(/\n?Dictée en cours.*$/,'')+' '+finalText+interim).trim();scheduleSave()}};recognition.onerror=()=>{recognition=null;$('dictateBtn').textContent='🎙 Dictée'};recognition.onend=()=>{recognition=null;$('dictateBtn').textContent='🎙 Dictée';scheduleSave()};recognition.start();$('dictateBtn').textContent='■ Arrêter'}
function colorNote(){const n=current();if(!n)return;modal('Couleur de la note','Une couleur discrète pour la retrouver plus facilement.',`<label>Couleur</label><input name="color" type="color" value="${esc(n.color||'#ffffff')}">`,'Appliquer',fd=>{n.color=fd.get('color');saveData();renderList()})}
function moreMenu(){const n=current();if(!n)return;modal('Actions de la note','',`<button type="button" class="btn" id="duplicateNote">Dupliquer la note</button><button type="button" class="btn" id="deleteNote" style="margin-top:8px;color:#b34b42">Mettre à la corbeille</button>`,'Fermer',()=>{});$('duplicateNote').onclick=()=>{const copy={...n,id:uid(),title:(n.title||'Sans titre')+' (copie)',createdAt:now(),updatedAt:now(),locked:false};delete copy.cipher;data.notes.unshift(copy);currentId=copy.id;saveData();$('modalRoot').innerHTML='';renderAll()};$('deleteNote').onclick=()=>{if(confirm('Mettre cette note à la corbeille ?')){n.deleted=true;n.updatedAt=now();currentId=null;saveData();$('modalRoot').innerHTML='';renderAll()}}}
function applyFilter(f){filter=f;folderFilter=null;renderAll()}
$('newNoteBtn').onclick=$('emptyNew').onclick=$('mobileNew').onclick=createNote;
$('newFolder').onclick=createFolder;$('exportBtn').onclick=exportData;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};
$('themeBtn').onclick=()=>{settings.theme=settings.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=settings.theme;saveSettings()};
$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');$('mobileFolders').onclick=()=>$('sidebar').classList.toggle('open');$('mobileHome').onclick=()=>applyFilter('all');$('mobileSearch').onclick=()=>{$('search').focus();window.scrollTo({top:0,behavior:'smooth'})};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{applyFilter(b.dataset.filter);if(innerWidth<=800)$('sidebar').classList.remove('open')});
$('search').oninput=e=>{query=e.target.value;renderList()};$('sortBtn').onclick=()=>{sortNewest=!sortNewest;renderList()};
$('title').oninput=scheduleSave;$('noteEmoji').oninput=scheduleSave;$('tags').onchange=scheduleSave;$('editor').addEventListener('input',scheduleSave);
$('editor').addEventListener('click',e=>{const a=e.target.closest('a[data-note-id]');if(a){e.preventDefault();const id=a.dataset.noteId;if(data.notes.some(n=>n.id===id)){currentId=id;filter='all';folderFilter=null;renderAll()}}});
$('linkBtn').onclick=addLink;$('dictateBtn').onclick=dictate;$('tableBtn').onclick=addTable;$('checkBtn').onclick=addCheck;$('quoteBtn').onclick=addQuote;$('moveBtn').onclick=moveNote;$('colorBtn').onclick=colorNote;$('lockBtn').onclick=()=>current()?.locked?unlockNote():protectNote();$('favoriteBtn').onclick=()=>{const n=current();if(n){n.favorite=!n.favorite;saveData();renderAll()}};
$('emojiBtn').onclick=()=>{const n=current();if(!n)return;modal('Emoji de la note','Choisis un symbole simple ou colle ton emoji préféré.',`<label>Emoji</label><input name="emoji" value="${esc(n.emoji||'📝')}" maxlength="8">`,'Appliquer',fd=>{n.emoji=fd.get('emoji')||'📝';saveData();renderAll()})};
$('moreBtn').onclick=moreMenu;
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();createNote()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus()}if(e.key==='Escape')$('sidebar').classList.remove('open')});
loadData();renderAll();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
